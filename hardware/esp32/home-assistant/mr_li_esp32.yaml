# HA package. Merge .local/ha-secrets.yaml into HA secrets.yaml.
# Under homeassistant: add packages: !include_dir_named packages
rest_command:
  mr_li_esp32_xgimi_power_on:
    url: !secret mr_li_esp32_wake_url
    method: post
    headers:
      Authorization: !secret mr_li_esp32_authorization
    timeout: 5

rest:
  - resource: !secret mr_li_esp32_status_url
    headers:
      Authorization: !secret mr_li_esp32_authorization
    scan_interval: 15
    timeout: 5
    sensor:
      - name: "极米蓝牙控制器状态"
        unique_id: mr_li_esp32_xgimi_operation
        value_template: "{{ value_json.xgimi.state }}"
        json_attributes_path: "$.xgimi"
        json_attributes:
          - configured
          - busy
          - error
          - physical_effect_confirmed

script:
  mr_li_xgimi_power_on:
    alias: "极米蓝牙开机"
    description: "通过 Wi-Fi 请求 ESP32 发送已学习的蓝牙开机广播；发送成功不代表投影已开机。"
    icon: mdi:projector
    mode: single
    sequence:
      - action: rest_command.mr_li_esp32_xgimi_power_on
        response_variable: wake_response
      - if: "{{ wake_response.status != 202 or not wake_response.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 未接受蓝牙开机请求"
            error: true

template:
  - button:
      - name: "极米蓝牙开机"
        unique_id: mr_li_esp32_xgimi_wake
        icon: mdi:projector
        press:
          - action: script.mr_li_xgimi_power_on

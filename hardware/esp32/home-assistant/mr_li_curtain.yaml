# RF learning/control package for the existing authenticated ESP32 HTTP API.
# The command URL secret includes {{ action }}; no extra MQTT service is needed.
rest_command:
  mr_li_curtain_command:
    url: !secret mr_li_rf_command_url_template
    method: post
    headers:
      Authorization: !secret mr_li_esp32_authorization
    content_type: application/json
    payload: "{{ payload | default('') }}"
    timeout: 5

rest:
  - resource: !secret mr_li_esp32_status_url
    headers:
      Authorization: !secret mr_li_esp32_authorization
    scan_interval: 5
    timeout: 5
    sensor:
      - name: RF Curtain Controller
        unique_id: mr_li_rf_curtain_controller
        value_template: "{{ value_json.curtain.state }}"
        json_attributes_path: "$.curtain"
        json_attributes:
          - configured
          - pins_configured
          - enabled
          - tx_gpio
          - rx_gpio
          - learned
          - busy
          - learning_action
          - frames_seen
          - matches
          - bursts
          - last_action
          - error
          - physical_effect_confirmed

template:
  - cover:
      - name: 朗森窗帘
        unique_id: mr_li_rf_curtain
        device_class: blind
        availability: "{{ states('sensor.rf_curtain_controller') not in ['unknown', 'unavailable'] and state_attr('sensor.rf_curtain_controller', 'configured') == true and state_attr('sensor.rf_curtain_controller', 'enabled') == true }}"
        state: "{{ none }}"
        open_cover:
          - action: script.mr_li_curtain_up
        close_cover:
          - action: script.mr_li_curtain_down
        stop_cover:
          - action: script.mr_li_curtain_stop
  - switch:
      - name: 窗帘确认固定码并启用发射
        unique_id: mr_li_rf_curtain_enable
        state: "{{ state_attr('sensor.rf_curtain_controller', 'enabled') == true }}"
        availability: "{{ states('sensor.rf_curtain_controller') not in ['unknown', 'unavailable'] }}"
        turn_on:
          - action: script.mr_li_curtain_enable
        turn_off:
          - action: script.mr_li_curtain_disable

script:
  mr_li_curtain_up:
    alias: "窗帘上升"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: up
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_down:
    alias: "窗帘下降"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: down
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_stop:
    alias: "窗帘停止"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: stop
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_learn_up:
    alias: "窗帘学习上升（三次短按）"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: learn/up
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_learn_down:
    alias: "窗帘学习下降（三次短按）"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: learn/down
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_learn_stop:
    alias: "窗帘学习停止（三次短按）"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: learn/stop
        response_variable: rf_result
      - if: "{{ rf_result.status != 202 or not rf_result.content.get('accepted', false) }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_enable:
    alias: "窗帘确认固定码并启用发射"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: enable
          payload: '{ "enabled": true, "fixed_code_confirmed": true }'
        response_variable: rf_result
      - if: "{{ rf_result.status != 200 }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller
  mr_li_curtain_disable:
    alias: "窗帘禁用射频发射"
    mode: single
    icon: mdi:curtains
    sequence:
      - action: rest_command.mr_li_curtain_command
        data:
          action: enable
          payload: '{ "enabled": false }'
        response_variable: rf_result
      - if: "{{ rf_result.status != 200 }}"
        then:
          - stop: "ESP32 拒绝射频请求，请查看控制器状态与错误"
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.rf_curtain_controller

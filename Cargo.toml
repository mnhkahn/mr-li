[package]
name = "mr-li"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "李老师：飞书与 OpenCode 的轻量桥接"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
futures-util = "0.3"
fs2 = "0.4"
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
